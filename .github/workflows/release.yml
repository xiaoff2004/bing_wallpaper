name: Release packages

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Verify version tag
        env:
          RELEASE_REF: ${{ github.ref }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import os, tomllib
          version = tomllib.load(open('Cargo.toml', 'rb'))['package']['version']
          assert os.environ['RELEASE_REF'].startswith('refs/tags/'), 'Run this workflow on a version tag'
          assert os.environ['RELEASE_TAG'] == 'v' + version, 'Tag must match Cargo.toml version'
          PY
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install build and packaging dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config libx11-dev libxi-dev libxrandr-dev libxkbcommon-dev libwayland-dev libgl1-mesa-dev desktop-file-utils xvfb libgl1-mesa-dri
      - uses: Swatinem/rust-cache@v2
      - name: Check application
        run: sh scripts/check.sh
      - name: Build native release
        run: cargo build --release --locked -j 2
      - name: Package and verify
        run: |
          python3 scripts/package.py
          python3 scripts/verify-package.py
      - name: Test DEB installation and GUI startup
        run: |
          sudo apt-get install -y ./dist/*.deb
          /usr/bin/bing-wallpaper-rs --version
          timeout 45s dbus-run-session -- xvfb-run -a env LIBGL_ALWAYS_SOFTWARE=1 /usr/bin/bing-wallpaper-rs --smoke-screenshot "$RUNNER_TEMP/bing-wallpaper.png"
          test -s "$RUNNER_TEMP/bing-wallpaper.png"
          sudo apt-get remove -y bing-wallpaper-rs
      - uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64-packages
          if-no-files-found: error
          path: |
            dist/*.deb
            dist/*.tar.gz
            dist/SHA256SUMS
            dist/build-info.json

  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: linux-x86_64-packages
          path: dist
      - name: Verify downloaded assets
        run: cd dist && sha256sum --check SHA256SUMS
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 scripts/publish-release.py
