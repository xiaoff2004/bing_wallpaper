[package]
name = "bing-wallpaper-rs"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Bing daily wallpapers with a native Rust UI and Linux desktop integration"
license = "MIT"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
dirs = "6"
eframe = { version = "0.33", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
fs2 = "0.4"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
ksni = { version = "0.3", features = ["blocking"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls", "system-proxy"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
toml = "0.9"
url = "2"
zbus = "5"

[profile.release]
lto = "thin"
strip = true

[profile.dev]
debug = 0

[profile.test]
debug = 0
